name = "mobile-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Gemini refuses requests from some regions. Running the Worker in a fixed US region avoids
# random "User location is not supported" errors. Remove this block if you do not use Gemini.
[placement]
mode = "targeted"
region = "gcp:us-central1"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

[observability]
enabled = true
